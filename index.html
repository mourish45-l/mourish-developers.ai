<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mourish AI Chat</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<link rel="stylesheet" href="ai.css" type="text/css" media="all" />
<style>
  /* Scrollbar for chat */
  #chat::-webkit-scrollbar { width: 8px; }
  #chat::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 4px; }
  .copy-btn { transition: all 0.2s; opacity: 0; }
  .group:hover .copy-btn { opacity: 1; }
</style>
</head>
<body class="bg-gray-100 flex flex-col h-screen">

<!-- Header + Hamburger -->
<header class="bg-white shadow-md flex justify-between items-center p-3">
  <button id="menu-btn" class="text-gray-700 text-xl lg:hidden"><i class="fa-solid fa-bars"></i></button>
  <h1 class="text-indigo-600 font-bold text-lg">Mourish AI</h1>
  <div id="user-menu" class="hidden lg:flex space-x-3">
    <span id="user-name"></span>
    <button id="logout" class="bg-red-500 px-3 py-1 text-white rounded hover:bg-red-600">Logout</button>
  </div>
</header>

<div class="flex flex-grow overflow-hidden">

  <!-- Sidebar: Recent Chats -->
  <aside id="sidebar" class="bg-white w-64 p-4 border-r hidden lg:block overflow-y-auto">
    <h2 class="font-bold mb-2">Recent Chats</h2>
    <ul id="recent-chats" class="space-y-2"></ul>
  </aside>

  <!-- Main Chat Area -->
  <div class="flex flex-col flex-grow">
    <div id="chat" class="flex-grow p-4 overflow-y-auto space-y-3"></div>

    <!-- Input -->
    <form id="form" class="p-3 border-t flex items-center space-x-2 bg-white">
      <label for="file-input" class="cursor-pointer text-gray-500 hover:text-indigo-600"><i class="fa-solid fa-upload text-xl"></i></label>
      <input id="file-input" type="file" class="hidden" accept=".txt,.csv,.py,.js,.html,.json" multiple>
      <textarea id="input" class="flex-grow border rounded-lg p-2 focus:ring focus:ring-indigo-500 resize-none" rows="1" placeholder="Type or upload a file..."></textarea>
      <button id="send" type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700"><i class="fa-solid fa-paper-plane"></i></button>
      <button id="stop" type="button" class="bg-red-500 text-white px-3 py-2 rounded-lg hover:bg-red-600 hidden"><i class="fa-solid fa-stop"></i></button>
    </form>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

// 🔑 Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyDVTOOenFVKEJoya0LSchrMqjBmNUShuI",
  authDomain: "mourish-developers-studio-2025.firebaseapp.com",
  databaseURL: "https://mourish-developers-studio-2025-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "mourish-developers-studio-2025",
  storageBucket: "mourish-developers-studio-2025.firebasestorage.app",
  messagingSenderId: "22567220213",
  appId: "1:22567220213:web:31e392665b3f48025466bc"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const chatRef = ref(db, "chats");
const auth = getAuth();
const provider = new GoogleAuthProvider();

// DOM Elements
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const fileInput = document.getElementById("file-input");
const stopBtn = document.getElementById("stop");
const recentChats = document.getElementById("recent-chats");
const sidebar = document.getElementById("sidebar");
const menuBtn = document.getElementById("menu-btn");
const userName = document.getElementById("user-name");
const logoutBtn = document.getElementById("logout");

let controller = null;

// 🧾 Authentication
function login() {
  signInWithPopup(auth, provider).catch(console.error);
}
logoutBtn.addEventListener("click", () => signOut(auth));

onAuthStateChanged(auth, (user) => {
  if (user) {
    userName.textContent = user.displayName;
    sidebar.classList.remove("hidden");
  } else {
    login();
  }
});

// 📋 Copy code
window.copyCode = async (id, btn) => {
  const code = document.getElementById(id).innerText;
  await navigator.clipboard.writeText(code);
  btn.innerText = "Copied!";
  setTimeout(() => btn.innerText = "Copy", 2000);
};

// 🖇️ Hamburger Menu
menuBtn.addEventListener("click", () => sidebar.classList.toggle("hidden"));

// 📝 Append message
function appendMessage(sender, html) {
  const wrapper = document.createElement("div");
  wrapper.className = sender === "user" ? "flex justify-end" : "flex justify-start";
  const msg = document.createElement("div");
  msg.className = sender === "user" ? "bg-indigo-600 text-white p-3 rounded-2xl max-w-lg" : "bg-gray-100 text-gray-900 p-3 rounded-2xl max-w-lg";
  msg.innerHTML = html;
  wrapper.appendChild(msg);
  chat.appendChild(wrapper);
  chat.scrollTop = chat.scrollHeight;
}

// 💾 Save to Firebase
function saveChatFirebase(role, text) {
  push(chatRef, { role, text, timestamp: Date.now() });
}

// 🔄 Load chats
onValue(chatRef, (snapshot) => {
  chat.innerHTML = "";
  recentChats.innerHTML = "";
  const data = snapshot.val();
  if (data) {
    Object.values(data).sort((a,b)=>a.timestamp-b.timestamp).forEach(msg => {
      appendMessage(msg.role, msg.text);
      // Recent chat sidebar
      const li = document.createElement("li");
      li.className = "cursor-pointer hover:text-indigo-600 text-sm";
      li.textContent = msg.text.length > 30 ? msg.text.substring(0,30)+"..." : msg.text;
      li.addEventListener("click", ()=> appendMessage("user", msg.text));
      recentChats.appendChild(li);
    });
  }
});

// 📂 Handle files (Base64)
fileInput.addEventListener("change", async (e) => {
  for (const file of e.target.files) {
    const reader = new FileReader();
    reader.onload = async () => {
      const base64 = reader.result.split(",")[1]; // get base64 only
      appendMessage("user", `<strong>Uploaded:</strong> ${file.name}`);
      await askGemini(`Analyze this file (${file.name}):\n\n${base64.substring(0,2000)}`);
    };
    reader.readAsDataURL(file);
  }
});

// 🧠 Gemini AI call
async function askGemini(prompt) {
  stopBtn.classList.remove("hidden");
  controller = new AbortController();
  appendMessage("bot", "💎 Thinking...");
  try {
    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=AIzaSyDdt7GWpK0u8_h50N9Pc34YKAB3zvAcroE`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ contents: [{ role:"user", parts:[{text: prompt}]}] }),
      signal: controller.signal
    });
    const data = await response.json();
    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Error.";
    showBotReply(reply);
    saveChatFirebase("user", prompt);
    saveChatFirebase("bot", reply);
  } catch(e) {
    appendMessage("bot", "❌ Chat stopped or failed.");
  } finally {
    stopBtn.classList.add("hidden");
    controller = null;
  }
}

// 💻 Show bot reply with code copy
function showBotReply(text) {
  const formatted = text.replace(/```(\w+)?\n([\s\S]*?)```/g, (m, lang, code) => {
    const id = "c" + Math.random().toString(36).substring(2,7);
    return `<div class='relative group'><pre><code id='${id}'>${code}</code></pre>
      <button class='copy-btn absolute top-1 right-1 bg-gray-600 text-white px-2 py-1 rounded hover:bg-gray-500' onclick="copyCode('${id}', this)">Copy</button></div>`;
  });
  appendMessage("bot", formatted);
}

// 🛑 Stop button
stopBtn.addEventListener("click", () => {
  if(controller) controller.abort();
  appendMessage("bot","🛑 Chat stopped by user.");
});

// 💬 Form submit
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if(!text) return;
  appendMessage("user", text);
  input.value = "";
  await askGemini(text);
});
fileInput.addEventListener("change", async (e) => {
  for (const file of e.target.files) {
    const reader = new FileReader();

    reader.onload = async () => {
      const content = reader.result; // this is the actual text of the file

      // Show uploaded file in chat
      appendMessage("user", `<strong>Uploaded:</strong> ${file.name}`);

      // Trim large files to first 4000 characters for AI
      const preview = content.length > 4000 ? content.substring(0, 4000) : content;

      // Send to AI
      await askGemini(`Analyze this file (${file.name}):\n\n${preview}`);
    };

    // Determine if text or binary
    if (file.type.startsWith("text") || file.name.match(/\.(py|js|html|json|csv|txt)$/i)) {
      reader.readAsText(file); // Read as text
    } else {
      reader.readAsDataURL(file); // Read as Base64 for binary files
    }
  }
});
</script>
</body>
</html>
